# air live-reload config for the pcbpilot daemon.
#   make dev   (or: air)
# Rebuilds bin and restarts `pcbpilot daemon` on any .go change. The EasyEDA
# connector reconnects to 61832 in the background, so it auto-reconnects to
# the freshly restarted daemon with no manual Reconnect.
#   install air:  go install github.com/air-verse/air@latest
root = "."
tmp_dir = "tmp"

[build]
  # Version-stamped build to ./bin/pcbpilot AND best-effort refresh of the PATH
  # CLI (via `make dev-build`), then run THAT same binary as the daemon. One
  # build serves both roles, so the `pcbpilot` you invoke on PATH is never stale
  # relative to the hot-reloaded daemon.
  cmd = "make dev-build"
  bin = "./bin/pcbpilot"
  # Development must not overwrite the checked-out Skill with an older release.
  args_bin = ["daemon","start","--auto-update-skill=false"]
  # only watch Go sources of the daemon/CLI; ignore the connector, tools, docs
  include_ext = ["go"]
  include_dir = ["cmd", "internal", "pkg"]
  exclude_dir = ["bin", "tmp", "testdata", "extension", "tools", "docs", "skills"]
  exclude_regex = ["_test\\.go"]
  # debounce a burst of saves; SIGINT for graceful shutdown (daemon handles it),
  # then hard-kill after the delay if it hasn't exited.
  delay = 800
  send_interrupt = true
  kill_delay = "2s"
  stop_on_error = true
  log = "build-errors.log"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
