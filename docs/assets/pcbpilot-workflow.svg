<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- pcbpilot architecture. Palette follows docs/brand/pcbpilot-logo.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2433"/>
      <stop offset="1" stop-color="#050E16"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#1A3547"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12304A"/>
      <stop offset="1" stop-color="#0B1E2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2BD9C5"/>
      <stop offset="1" stop-color="#1FA3E0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#F6C56B"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2BD9C5"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="24" fill="url(#grid)"/>

  <text x="48" y="58" font-size="30" font-weight="700" fill="#E8F6FA">pcbpilot</text>
  <text x="190" y="58" font-size="17" fill="#8FB3C4">AI-native automation for EasyEDA Pro — typed actions, verified by readback</text>

  <!-- cards: x = 40, 272, 504, 736, 968 ; width 192 -->
  <g font-size="14" fill="#B9D3DE">
    <g>
      <rect x="40" y="110" width="192" height="210" rx="16" fill="url(#card)" stroke="#23506A"/>
      <rect x="40" y="110" width="192" height="6" rx="3" fill="url(#accent)"/>
      <text x="58" y="148" font-size="18" font-weight="700" fill="#E8F6FA">AI client</text>
      <text x="58" y="176">Claude Code · Codex</text>
      <text x="58" y="198">ZCode</text>
      <text x="58" y="232" fill="#2BD9C5" font-weight="600">pcbpilot Skill</text>
      <text x="58" y="254">workflow, guardrails,</text>
      <text x="58" y="276">examples · MCP tools</text>
    </g>
    <g>
      <rect x="272" y="110" width="192" height="210" rx="16" fill="url(#card)" stroke="#23506A"/>
      <rect x="272" y="110" width="192" height="6" rx="3" fill="url(#accent)"/>
      <text x="290" y="148" font-size="18" font-weight="700" fill="#E8F6FA">pcbpilot CLI</text>
      <text x="290" y="176">Cobra subcommands</text>
      <text x="290" y="198">typed JSON actions</text>
      <text x="290" y="232" fill="#2BD9C5" font-weight="600">pcb auto engine</text>
      <text x="290" y="254">place · route · DRC</text>
      <text x="290" y="276">offline, replayable plans</text>
    </g>
    <g>
      <rect x="504" y="110" width="192" height="210" rx="16" fill="url(#card)" stroke="#23506A"/>
      <rect x="504" y="110" width="192" height="6" rx="3" fill="url(#accent)"/>
      <text x="522" y="148" font-size="18" font-weight="700" fill="#E8F6FA">Local daemon</text>
      <text x="522" y="176">127.0.0.1:61832</text>
      <text x="522" y="198">login service</text>
      <text x="522" y="232" fill="#2BD9C5" font-weight="600">routes by window</text>
      <text x="522" y="254">audit log · autosave</text>
      <text x="522" y="276">write-health</text>
    </g>
    <g>
      <rect x="736" y="110" width="192" height="210" rx="16" fill="url(#card)" stroke="#23506A"/>
      <rect x="736" y="110" width="192" height="6" rx="3" fill="url(#accent)"/>
      <text x="754" y="148" font-size="18" font-weight="700" fill="#E8F6FA">PCB Pilot</text>
      <text x="754" y="170" font-size="18" font-weight="700" fill="#E8F6FA">Connector</text>
      <text x="754" y="198">.eext inside EasyEDA</text>
      <text x="754" y="232" fill="#2BD9C5" font-weight="600">typed handlers</text>
      <text x="754" y="254">guards before write</text>
      <text x="754" y="276">readback after write</text>
    </g>
    <g>
      <rect x="968" y="110" width="192" height="210" rx="16" fill="url(#card)" stroke="#23506A"/>
      <rect x="968" y="110" width="192" height="6" rx="3" fill="url(#accent)"/>
      <text x="986" y="148" font-size="18" font-weight="700" fill="#E8F6FA">EasyEDA Pro</text>
      <text x="986" y="176">official eda.* API</text>
      <text x="986" y="198">V3 · V4</text>
      <text x="986" y="232" fill="#2BD9C5" font-weight="600">desktop · Web</text>
      <text x="986" y="254">pro.easyeda.com</text>
      <text x="986" y="276">lceda.cn</text>
    </g>
  </g>

  <!-- forward arrows (copper) -->
  <g stroke="#F6C56B" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M232 200 H270"/>
    <path d="M464 200 H502"/>
    <path d="M696 200 H734"/>
    <path d="M928 200 H966"/>
  </g>
  <g font-size="12" fill="#F6C56B" text-anchor="middle">
    <text x="251" y="80">command</text><text x="251" y="96">/ MCP</text>
    <text x="483" y="80">HTTP</text><text x="483" y="96">/action</text>
    <text x="715" y="80">WebSocket</text><text x="715" y="96">:61832</text>
    <text x="947" y="80">eda.*</text>
  </g>

  <!-- feedback loop -->
  <path d="M1064 320 V392 H136 V324" stroke="#2BD9C5" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrowBack)"/>
  <rect x="330" y="372" width="540" height="40" rx="20" fill="#0B1E2E" stroke="#2BD9C5"/>
  <text x="600" y="398" font-size="15" fill="#CFF7F1" text-anchor="middle">readback: connectivity · geometry · DRC · save → reload → hash</text>

  <text x="48" y="460" font-size="13" fill="#6F92A3">Every project write is a typed action from parameterised data — no GUI automation. Layout is shown to the user and confirmed before routing.</text>
</svg>
