<svg xmlns="http://www.w3.org/2000/svg" class="rc" viewBox="0 0 720 310" width="720" height="310" role="img" aria-label="负载焊盘直流压降 / 预算 IR drop per load pad"><title>负载焊盘直流压降 / 预算 IR drop per load pad</title><desc>横向柱状图：9 行，单位 %</desc><style>.rc{--rc-bg:#fcfcfb;--rc-ink:#0b0b0b;--rc-ink2:#52514e;--rc-grid:#e6e5e0;--rc-axis:#b9b8b2;--rc-box:#f3f2ee;--rc-ok:#0ca30c;--rc-warn:#fab219;--rc-bad:#d03b3b;--rc-unk:#9a9994;--rc-s1:#2a78d6;--rc-s2:#eb6834;--rc-s3:#1baf7a;--rc-s4:#eda100;--rc-s5:#e87ba4;--rc-s6:#008300;--rc-s7:#4a3aa7;--rc-s8:#e34948;}@media (prefers-color-scheme:dark){.rc{--rc-bg:#1a1a19;--rc-ink:#ffffff;--rc-ink2:#c3c2b7;--rc-grid:#34332f;--rc-axis:#5d5c57;--rc-box:#262624;--rc-s1:#3987e5;--rc-s2:#d95926;--rc-s3:#199e70;--rc-s4:#c98500;--rc-s5:#d55181;--rc-s6:#008300;--rc-s7:#9085e9;--rc-s8:#e66767;}}@media print{.rc{--rc-bg:#ffffff;--rc-ink:#000000;--rc-ink2:#333333;--rc-box:#f4f4f4}}.rc text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:12px;fill:var(--rc-ink)}.rc .m{fill:var(--rc-ink2)}.rc .sm{font-size:11px}.rc .ttl{font-size:14px;font-weight:600}.rc .grid{stroke:var(--rc-grid);stroke-width:1}.rc .axis{stroke:var(--rc-axis);stroke-width:1}.rc .bg{fill:var(--rc-bg)}.rc .ok{fill:var(--rc-ok)}.rc .warn{fill:var(--rc-warn)}.rc .bad{fill:var(--rc-bad)}.rc .unk{fill:var(--rc-unk)}.rc .box{fill:var(--rc-box);stroke:var(--rc-axis)}.rc .lbl{paint-order:stroke;stroke:var(--rc-bg);stroke-width:4px;stroke-linejoin:round}.rc .edge{fill:none;stroke:var(--rc-ink2);stroke-width:1.5}.rc .thr{stroke:var(--rc-bad);stroke-width:1.5;stroke-dasharray:4 3}.rc .thr2{stroke:var(--rc-warn);stroke-width:1.5;stroke-dasharray:4 3}.rc .s1{fill:var(--rc-s1)}.rc .k1{stroke:var(--rc-s1)}.rc .s2{fill:var(--rc-s2)}.rc .k2{stroke:var(--rc-s2)}.rc .s3{fill:var(--rc-s3)}.rc .k3{stroke:var(--rc-s3)}.rc .s4{fill:var(--rc-s4)}.rc .k4{stroke:var(--rc-s4)}.rc .s5{fill:var(--rc-s5)}.rc .k5{stroke:var(--rc-s5)}.rc .s6{fill:var(--rc-s6)}.rc .k6{stroke:var(--rc-s6)}.rc .s7{fill:var(--rc-s7)}.rc .k7{stroke:var(--rc-s7)}.rc .s8{fill:var(--rc-s8)}.rc .k8{stroke:var(--rc-s8)}</style><rect class="bg" x="0" y="0" width="720" height="310" rx="6"/><text class="ttl" x="16" y="24">负载焊盘直流压降 / 预算 IR drop per load pad</text><rect class="ok" x="16" y="36" width="12" height="12" rx="2"/><text class="sm" x="32" y="46">&lt; 80 %</text><rect class="warn" x="86" y="36" width="12" height="12" rx="2"/><text class="sm" x="102" y="46">80–100 %</text><rect class="bad" x="170" y="36" width="12" height="12" rx="2"/><text class="sm" x="186" y="46">超预算</text><line class="grid" x1="210.0" x2="210.0" y1="60" y2="262"/><text class="m sm" x="210.0" y="278" text-anchor="middle">0</text><line class="grid" x1="298.0" x2="298.0" y1="60" y2="262"/><text class="m sm" x="298.0" y="278" text-anchor="middle">20</text><line class="grid" x1="386.0" x2="386.0" y1="60" y2="262"/><text class="m sm" x="386.0" y="278" text-anchor="middle">40</text><line class="grid" x1="474.0" x2="474.0" y1="60" y2="262"/><text class="m sm" x="474.0" y="278" text-anchor="middle">60</text><line class="grid" x1="562.0" x2="562.0" y1="60" y2="262"/><text class="m sm" x="562.0" y="278" text-anchor="middle">80</text><line class="grid" x1="650.0" x2="650.0" y1="60" y2="262"/><text class="m sm" x="650.0" y="278" text-anchor="middle">100</text><text class="m sm" x="430" y="296" text-anchor="middle">占预算 (%)</text><line class="axis" x1="210.0" x2="210.0" y1="60" y2="262"/><text class="sm" x="202" y="79" text-anchor="end">USB_VBUS @ D2.2</text><rect class="ok" x="210.0" y="68" width="78.7" height="14" rx="2"><title>USB_VBUS @ D2.2: 17.873 mV / 预算 99.9 mV（0.43 A）</title></rect><text class="m sm" x="292.7" y="79">17.87 mV（17.9 %）</text><text class="sm" x="202" y="101" text-anchor="end">VSYS_5V @ U1.4</text><rect class="ok" x="210.0" y="90" width="72.6" height="14" rx="2"><title>VSYS_5V @ U1.4: 15.617 mV / 预算 94.7 mV（0.43 A）</title></rect><text class="m sm" x="286.6" y="101">15.6